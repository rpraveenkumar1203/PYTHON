<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or 'Receipt App' }}</title>
  <style>
:root{--bg:#0b0c10;--card:#15171c;--ink:#eaeaea;--muted:#a3a3a3;--accent:#3b82f6}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,Segoe UI,Roboto,Ubuntu,Helvetica,Arial;background:var(--bg);color:var(--ink)}
.container{max-width:900px;margin:40px auto;padding:24px}
.card{background:var(--card);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.3);padding:24px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.h1{font-size:22px;margin:0}
label{display:block;margin:10px 0 6px;color:var(--muted)}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #2a2f3a;background:#0f1116;color:var(--ink)}
button{padding:12px 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
.btnrow{display:flex;gap:10px;margin-top:14px}
.table{width:100%;border-collapse:collapse}
.table th,.table td{border-bottom:1px solid #2a2f3a;padding:12px 8px;text-align:left}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;background:#223046;color:#a9d2ff;font-size:12px}
.nav{display:flex;gap:8px}
.link{color:#a9d2ff;text-decoration:none}
.alert{background:#1d2a22;color:#caf7d6;border:1px solid #21402a;padding:10px 12px;border-radius:10px;margin-bottom:12px}
.err{background:#2a1d1d;color:#ffd6d6;border:1px solid #402121}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="hdr">
        <h1 class="h1">{{ header or 'Receipt App' }}</h1>
        <div class="nav">
          <a class="link" href="/">Form</a>
          <a class="link" href="/admin/">Admin</a>
          <a class="link" href="/admin/export.xlsx">Download Excel</a>
        </div>
      </div>
      {% block body %}{% endblock %}
    </div>
  </div>
</body>
</html>
